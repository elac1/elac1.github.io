  <path class="line-thick" d="M 0 300 Q 60 260 140 220" />
  <path class="line" d="M 100 600 Q 180 500 120 380 T 260 220" />

  <!-- 右下角 -->
  <path class="line-thick" d="M 800 600 Q 720 540 640 570 T 480 520 T 320 580" />
  <path class="line" d="M 780 600 Q 700 500 740 420 T 600 300" />
  <path class="line" d="M 800 560 Q 740 480 660 520 T 520 440" />
  <path class="line" d="M 760 600 Q 680 520 620 460" />
  <path class="line-thick" d="M 800 520 Q 720 440 760 340 T 620 200" />
  <path class="line" d="M 800 440 Q 720 400 640 360" />
  <path class="line" d="M 740 600 Q 660 560 580 500" />
  <path class="line" d="M 800 380 Q 720 340 740 260 T 600 120" />
