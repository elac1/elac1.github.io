  <path class="line" d="M 740 0 Q 660 40 580 100" />
  <path class="line" d="M 800 220 Q 720 260 740 340 T 600 480" />
  <path class="line" d="M 770 0 Q 690 140 720 280 T 560 440" />
  <path class="line-thick" d="M 800 300 Q 740 340 660 380" />
  <path class="line" d="M 700 0 Q 620 100 680 220 T 540 380" />

  <!-- 左下角 -->
  <path class="line-thick" d="M 0 600 Q 80 540 160 570 T 320 520 T 480 580" />
  <path class="line" d="M 20 600 Q 100 500 60 420 T 200 300" />
  <path class="line" d="M 0 560 Q 60 480 140 520 T 280 440" />
  <path class="line" d="M 40 600 Q 120 520 180 460" />
  <path class="line-thick" d="M 0 520 Q 80 440 40 340 T 180 200" />
  <path class="line" d="M 0 440 Q 80 400 160 360" />
  <path class="line" d="M 60 600 Q 140 560 220 500" />
  <path class="line" d="M 0 380 Q 80 340 60 260 T 200 120" />
