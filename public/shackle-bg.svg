<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .line { stroke: var(--shackle-line, rgba(0,0,0,0.09)); stroke-width: 1; fill: none; stroke-linecap: round; }
      .line-thick { stroke: var(--shackle-line, rgba(0,0,0,0.11)); stroke-width: 1.5; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 左上角：线条从角落向内发散、纠缠、挣脱 -->
  <path class="line-thick" d="M 0 0 Q 80 60 160 30 T 320 80 T 480 20" />
  <path class="line" d="M 20 0 Q 100 100 60 180 T 200 300" />
  <path class="line" d="M 0 40 Q 60 120 140 80 T 280 160" />
  <path class="line" d="M 40 0 Q 120 80 180 140" />
  <path class="line-thick" d="M 0 80 Q 80 160 40 260 T 180 400" />
  <path class="line" d="M 0 160 Q 80 200 160 240" />
  <path class="line" d="M 60 0 Q 140 40 220 100" />
  <path class="line" d="M 0 220 Q 80 260 60 340 T 200 480" />
  <path class="line" d="M 30 0 Q 110 140 80 280 T 240 440" />
  <path class="line-thick" d="M 0 300 Q 60 340 140 380" />
  <path class="line" d="M 100 0 Q 180 100 120 220 T 260 380" />

  <!-- 右上角：线条挣脱出界 -->
  <path class="line-thick" d="M 800 0 Q 720 60 640 30 T 480 80 T 320 20" />
  <path class="line" d="M 780 0 Q 700 100 740 180 T 600 300" />
  <path class="line" d="M 800 40 Q 740 120 660 80 T 520 160" />
