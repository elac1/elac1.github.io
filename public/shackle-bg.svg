  <!-- 中间纠缠的线条（像在挣脱中） -->
  <path class="line" d="M 400 100 Q 350 200 420 300 T 380 500" />
  <path class="line-thick" d="M 300 200 Q 400 250 500 200 T 600 300" />
  <path class="line" d="M 500 150 Q 450 250 520 350 T 480 550" />
  <path class="line" d="M 250 350 Q 350 400 450 350 T 550 450" />
  <path class="line-thick" d="M 350 150 Q 300 300 380 400 T 340 550" />
  <path class="line" d="M 550 250 Q 500 350 570 450 T 530 580" />
  <path class="line" d="M 200 450 Q 300 420 400 480" />
  <path class="line" d="M 600 100 Q 550 200 620 280" />
  <path class="line-thick" d="M 400 500 Q 350 400 420 300 T 380 100" />
  <path class="line" d="M 280 280 Q 380 220 480 280 T 580 220" />
  <path class="line" d="M 520 480 Q 480 380 540 280 T 500 100" />
